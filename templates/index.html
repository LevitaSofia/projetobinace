<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERPUNK TRADER TERMINAL</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Google Fonts (Orbitron para vibe Cyberpunk) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400;700&display=swap"
        rel="stylesheet">

    <!-- Lightweight Charts (TradingView) -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --text-primary: #00ff41;
            /* Matrix Green */
            --text-secondary: #008f11;
            --accent-color: #00ff41;
            --danger-color: #ff003c;
            /* Cyberpunk Red */
            --warning-color: #fcee0a;
            /* Cyberpunk Yellow */
            --border-color: #1a1a1a;
            --glow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Roboto Mono', monospace;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .cyber-font {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Scrollbar Customizada */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-primary);
        }

        /* Cards Cyberpunk */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            animation: scanline 3s linear infinite;
        }

        @keyframes scanline {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .card-header {
            background-color: rgba(0, 255, 65, 0.05);
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            color: var(--accent-color);
        }

        /* Status Badges */
        .badge-cyber {
            background-color: rgba(0, 255, 65, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            box-shadow: var(--glow);
        }

        .badge-danger-cyber {
            background-color: rgba(255, 0, 60, 0.1);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.3);
        }

        /* Tabela Cyberpunk */
        .table-cyber {
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .table-cyber th {
            background-color: rgba(0, 255, 65, 0.05);
            border-color: var(--border-color);
            color: var(--accent-color);
        }

        .table-cyber td {
            background-color: transparent;
            border-color: var(--border-color);
        }

        .table-cyber tr:hover td {
            background-color: rgba(0, 255, 65, 0.05);
            color: #fff;
        }

        /* Botões */
        .btn-cyber {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            text-transform: uppercase;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-cyber:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: var(--glow);
        }

        /* Chart Container */
        #chart-container {
            width: 100%;
            height: 400px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        /* Logs Terminal */
        #logs-container {
            height: 300px;
            overflow-y: auto;
            background-color: #000;
            border: 1px solid var(--border-color);
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #ccc;
        }

        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid #111;
            padding-bottom: 2px;
        }

        .log-time {
            color: var(--text-secondary);
            margin-right: 10px;
        }

        .log-info {
            color: #4facfe;
        }

        .log-warning {
            color: var(--warning-color);
        }

        .log-error {
            color: var(--danger-color);
        }

        .log-success {
            color: var(--accent-color);
        }

        /* Navbar */
        .navbar-cyber {
            background-color: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .navbar-brand {
            color: var(--accent-color) !important;
            font-weight: bold;
            text-shadow: var(--glow);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-cyber sticky-top mb-4">
        <div class="container-fluid">
            <a class="navbar-brand cyber-font" href="#">
                <i class="bi bi-cpu-fill"></i> SYSTEM_OVERRIDE_V2
            </a>
            <div class="d-flex align-items-center">
                <span class="badge badge-cyber me-3" id="server-status">
                    <i class="bi bi-activity"></i> ONLINE
                </span>
                <span class="text-muted small" id="last-update">--:--:--</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">

        <!-- Dashboard Grid -->
        <div class="row g-4">

            <!-- Coluna Esquerda: Status & Carteira -->
            <div class="col-lg-3">
                <!-- Card Saldo -->
                <div class="card">
                    <div class="card-header"><i class="bi bi-wallet2"></i> CARTEIRA</div>
                    <div class="card-body text-center">
                        <h2 class="cyber-font" id="total-balance">$0.00</h2>
                        <p class="text-muted mb-0">USDT Disponível: <span id="usdt-balance"
                                class="text-white">$0.00</span></p>
                        <hr class="border-secondary">
                        <div class="d-flex justify-content-between">
                            <span>PnL Hoje:</span>
                            <span id="pnl-today" class="fw-bold">0.00%</span>
                        </div>
                    </div>
                </div>

                <!-- Card Posições Abertas -->
                <div class="card">
                    <div class="card-header"><i class="bi bi-layers"></i> POSIÇÕES ABERTAS</div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush" id="positions-list">
                            <!-- Inserido via JS -->
                            <div class="text-center p-3 text-muted">Nenhuma posição ativa</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna Central: Gráfico & Watchlist -->
            <div class="col-lg-6">
                <!-- Gráfico Principal -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-graph-up"></i> ANÁLISE DE MERCADO</span>
                        <select class="form-select form-select-sm bg-dark text-light border-secondary w-auto"
                            id="chart-symbol-select">
                            <option value="BTC/USDT">BTC/USDT</option>
                            <option value="ETH/USDT">ETH/USDT</option>
                            <option value="SOL/USDT">SOL/USDT</option>
                        </select>
                    </div>
                    <div class="card-body p-0">
                        <div id="chart-container"></div>
                    </div>
                </div>

                <!-- Tabela de Oportunidades (Watchlist) -->
                <div class="card">
                    <div class="card-header"><i class="bi bi-radar"></i> RADAR DE OPORTUNIDADES (RSI)</div>
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-cyber table-sm mb-0">
                            <thead>
                                <tr>
                                    <th>Par</th>
                                    <th>Preço</th>
                                    <th>RSI (14)</th>
                                    <th>Tendência</th>
                                    <th>Ação</th>
                                </tr>
                            </thead>
                            <tbody id="watchlist-body">
                                <!-- JS preenche -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Coluna Direita: Logs & Controle -->
            <div class="col-lg-3">
                <!-- Painel de Controle -->
                <div class="card">
                    <div class="card-header"><i class="bi bi-joystick"></i> CONTROLE MANUAL</div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-cyber btn-sm" onclick="sendCommand('analyze')">
                                <i class="bi bi-search"></i> FORÇAR ANÁLISE
                            </button>
                            <button class="btn btn-cyber btn-sm" onclick="sendCommand('report')">
                                <i class="bi bi-file-text"></i> GERAR RELATÓRIO
                            </button>
                            <button class="btn btn-cyber btn-sm" onclick="sendCommand('daily_email')">
                                <i class="bi bi-envelope"></i> TESTAR E-MAIL (FECHAMENTO)
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="sendCommand('panic')">
                                <i class="bi bi-exclamation-triangle"></i> PANIC SELL (VENDER TUDO)
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Logs do Sistema -->
                <div class="card">
                    <div class="card-header"><i class="bi bi-terminal"></i> SYSTEM LOGS</div>
                    <div class="card-body p-0">
                        <div id="connection-info" class="px-3 py-2 border-bottom border-secondary small text-muted">
                            API: inicializando...
                        </div>
                        <div id="logs-container">
                            <div class="log-entry"><span class="log-time">--:--</span> <span
                                    class="log-info">Inicializando interface...</span></div>
                        </div>
                    </div>
                </div>
            </div>

        </div> <!-- End Row -->
    </div>

    <!-- Scripts -->
    <script>
        // --- Configuração do Gráfico (Lightweight Charts) ---
        // Importante: se a CDN falhar no cliente (sem internet/firewall), NÃO podemos travar o restante do JS.
        const chartContainer = document.getElementById('chart-container');
        let chart = null;
        let candleSeries = { setData: () => { } };

        function initChartSafe() {
            try {
                if (!window.LightweightCharts || !chartContainer) {
                    console.warn('LightweightCharts indisponível; gráfico desativado.');
                    return;
                }

                chart = LightweightCharts.createChart(chartContainer, {
                    layout: { background: { color: '#0a0a0a' }, textColor: '#00ff41' },
                    grid: { vertLines: { color: '#1a1a1a' }, horzLines: { color: '#1a1a1a' } },
                    timeScale: { borderColor: '#1a1a1a' },
                    rightPriceScale: { borderColor: '#1a1a1a' },
                });

                candleSeries = chart.addCandlestickSeries({
                    upColor: '#00ff41', downColor: '#ff003c',
                    borderUpColor: '#00ff41', borderDownColor: '#ff003c',
                    wickUpColor: '#00ff41', wickDownColor: '#ff003c',
                });

                // Redimensionar gráfico responsivo
                window.addEventListener('resize', () => {
                    try {
                        chart.resize(chartContainer.clientWidth, 400);
                    } catch (_) { }
                });
            } catch (e) {
                console.error('Erro ao inicializar gráfico (ignorado):', e);
            }
        }

        initChartSafe();

        // --- Util: logs da UI + estado de conexão ---
        const connectionInfoEl = document.getElementById('connection-info');
        const logsContainerEl = document.getElementById('logs-container');

        function setConnectionInfo(text, ok) {
            if (!connectionInfoEl) return;
            connectionInfoEl.textContent = text;
            connectionInfoEl.className = `px-3 py-2 border-bottom border-secondary small ${ok ? 'text-success' : 'text-danger'}`;
        }

        function appendUiLog(level, message) {
            if (!logsContainerEl) return;
            const now = new Date();
            const time = now.toLocaleTimeString();
            let colorClass = 'log-info';
            if (level === 'ERROR') colorClass = 'log-error';
            if (level === 'WARNING') colorClass = 'log-warning';
            if (level === 'SUCCESS') colorClass = 'log-success';

            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-time">[${time}]</span> <span class="${colorClass}">UI/${level}: ${message}</span>`;
            logsContainerEl.appendChild(div);
            logsContainerEl.scrollTop = logsContainerEl.scrollHeight;
        }

        appendUiLog('INFO', `Carregada em ${window.location.origin}`);
        setConnectionInfo(`API: conectando em ${window.location.origin} ...`, false);

        // --- Funções de Dados ---

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                // Atualiza Carteira
                document.getElementById('total-balance').innerText = `$${parseFloat(data.total_balance).toFixed(2)}`;
                document.getElementById('usdt-balance').innerText = `$${parseFloat(data.usdt_balance).toFixed(2)}`;

                // Atualiza Status Server
                const statusBadge = document.getElementById('server-status');
                statusBadge.innerHTML = '<i class="bi bi-activity"></i> ONLINE';
                statusBadge.className = 'badge badge-cyber me-3';

                document.getElementById('last-update').innerText = new Date().toLocaleTimeString();

                setConnectionInfo(`API: OK (${window.location.origin})`, true);

            } catch (e) {
                console.error("Erro status:", e);
                const statusBadge = document.getElementById('server-status');
                statusBadge.innerHTML = '<i class="bi bi-wifi-off"></i> OFFLINE';
                statusBadge.className = 'badge badge-danger-cyber me-3';

                setConnectionInfo(`API: falha (${window.location.origin})`, false);
                appendUiLog('ERROR', `Falha em /api/status: ${e?.message || e}`);
            }
        }

        async function fetchWatchlist() {
            try {
                const res = await fetch('/api/watchlist');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const tbody = document.getElementById('watchlist-body');
                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Sem dados no radar</td></tr>';
                    return;
                }

                data.forEach(coin => {
                    const rsi = parseFloat(coin.rsi).toFixed(1);
                    let rsiClass = 'text-muted';
                    let action = '-';

                    if (rsi < 30) { rsiClass = 'text-success fw-bold'; action = 'COMPRA'; }
                    else if (rsi > 70) { rsiClass = 'text-danger fw-bold'; action = 'VENDA'; }

                    const row = `
                        <tr>
                            <td class="fw-bold">${coin.symbol}</td>
                            <td>$${parseFloat(coin.price).toFixed(4)}</td>
                            <td class="${rsiClass}">${rsi}</td>
                            <td>${coin.trend || 'Neutro'}</td>
                            <td><span class="badge ${action === 'COMPRA' ? 'bg-success' : (action === 'VENDA' ? 'bg-danger' : 'bg-secondary')}">${action}</span></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (e) { console.error("Erro watchlist:", e); }
        }

        async function fetchPositions() {
            try {
                const res = await fetch('/api/positions');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const container = document.getElementById('positions-list');

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center p-3 text-muted">Nenhuma posição ativa</div>';
                    return;
                }

                let html = '';
                data.forEach(pos => {
                    const pnlClass = pos.net_profit >= 0 ? 'text-success' : 'text-danger';
                    const pnlIcon = pos.net_profit >= 0 ? 'bi-graph-up-arrow' : 'bi-graph-down-arrow';

                    // Formata Data/Hora
                    let timeStr = 'Recente';
                    if (pos.entry_time) {
                        try {
                            const dateObj = new Date(pos.entry_time);
                            timeStr = dateObj.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' +
                                dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                        } catch (e) { timeStr = pos.entry_time; }
                    }

                    // Cor do RSI
                    let rsiClass = 'text-muted';
                    const rsiVal = parseFloat(pos.rsi || 50);
                    if (rsiVal <= 30) rsiClass = 'text-success fw-bold';
                    else if (rsiVal >= 70) rsiClass = 'text-danger fw-bold';

                    html += `
                        <div class="list-group-item bg-dark border border-secondary text-light p-3 mb-2 shadow-sm">
                            
                            <!-- ROW 1: Símbolo e Botão Vender (Extremos) -->
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="fw-bold text-warning fs-5">${pos.symbol}</span>
                                <button class="btn btn-sm btn-outline-danger" onclick="closePosition('${pos.symbol}')" title="Vender Agora Manualmente">
                                    VENDER <i class="bi bi-x-lg"></i>
                                </button>
                            </div>

                            <!-- ROW 2: Info Secundária (Data e RSI) -->
                            <div class="d-flex align-items-center mb-3">
                                <span class="badge bg-secondary me-2" style="font-size: 0.7rem">${timeStr}</span>
                                <span class="badge border border-secondary text-light">RSI: <span class="${rsiClass}">${rsiVal.toFixed(1)}</span></span>
                            </div>
                            
                            <!-- ROW 3: Preços -->
                            <div class="row g-1 small mb-2 border-top border-secondary pt-2">
                                <div class="col-6 text-muted">Preço Pago:</div>
                                <div class="col-6 text-end fw-bold">$${parseFloat(pos.entry_price).toFixed(4)}</div>
                                
                                <div class="col-6 text-muted">Preço Atual:</div>
                                <div class="col-6 text-end text-light">$${parseFloat(pos.current_price).toFixed(4)}</div>
                            </div>

                            <!-- ROW 4: Lucro Líquido -->
                            <div class="d-flex justify-content-between align-items-center pt-2 border-top border-secondary bg-dark bg-opacity-25 mt-1 rounded p-1">
                                <span class="small text-muted fw-bold">LUCRO LÍQUIDO:</span>
                                <div class="text-end">
                                    <div class="fw-bold fs-5 ${pnlClass}">
                                        ${parseFloat(pos.net_profit) >= 0 ? '+' : ''}$${parseFloat(pos.net_profit).toFixed(2)}
                                    </div>
                                    <div class="small ${pnlClass}" style="font-size: 0.75rem">
                                        (${parseFloat(pos.profit_pct).toFixed(2)}%)
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (e) {
                console.error("Erro positions:", e);
                appendUiLog('WARNING', `Falha em /api/positions: ${e?.message || e}`);
            }
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const container = document.getElementById('logs-container');
                // Mantém as entradas de UI e adiciona as do servidor abaixo.
                // Remove apenas logs antigos do servidor (marcados com data-level).
                container.querySelectorAll('[data-log-source="server"]').forEach(n => n.remove());

                data.logs.forEach(log => {
                    let colorClass = 'log-info';
                    if (log.level === 'ERROR') colorClass = 'log-error';
                    if (log.level === 'WARNING') colorClass = 'log-warning';
                    if (log.message.includes('LUCRO')) colorClass = 'log-success';

                    const div = document.createElement('div');
                    div.className = 'log-entry';
                    div.setAttribute('data-log-source', 'server');
                    div.innerHTML = `<span class="log-time">[${log.time}]</span> <span class="${colorClass}">${log.message}</span>`;
                    container.appendChild(div);
                });

                // Auto-scroll para o final
                container.scrollTop = container.scrollHeight;
            } catch (e) { console.error("Erro logs:", e); }
        }

        async function loadChartData(symbol) {
            try {
                // Simulação ou endpoint real de candles
                const res = await fetch(`/api/chart/${symbol.replace('/', '_')}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data.candles) {
                    candleSeries.setData(data.candles);
                }
            } catch (e) { console.error("Erro chart:", e); }
        }

        // --- Inicialização ---

        // Loop de atualização (evita empilhar requisições se alguma travar)
        let refreshInFlight = false;
        setInterval(async () => {
            if (refreshInFlight) return;
            refreshInFlight = true;
            try {
                await Promise.allSettled([
                    fetchStatus(),
                    fetchWatchlist(),
                    fetchPositions(),
                    fetchLogs(),
                ]);
            } finally {
                refreshInFlight = false;
            }
        }, 2000); // 2 segundos

        // Carregar dados iniciais
        fetchStatus();
        fetchWatchlist();
        fetchPositions();
        fetchLogs();

        // Listener do Select de Gráfico
        document.getElementById('chart-symbol-select').addEventListener('change', (e) => {
            loadChartData(e.target.value);
        });

        // Carrega gráfico inicial
        loadChartData('BTC/USDT');

        // Comandos Manuais
        async function sendCommand(cmd) {
            if (!confirm(`Executar comando: ${cmd}?`)) return;
            try {
                const res = await fetch(`/api/command/${cmd}`, { method: 'POST' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const msg = data.message || data.error || `HTTP ${res.status}`;
                    alert(`Falha: ${msg}`);
                    return;
                }
                alert(data.message || 'Comando executado!');
            } catch (e) {
                alert(`Erro ao enviar comando: ${e?.message || e}`);
            }
        }

        async function closePosition(symbol) {
            if (!confirm(`VENDA MANUAL: Tem certeza que deseja vender ${symbol} a mercado agora?`)) return;
            try {
                const res = await fetch(`/api/close_position`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: symbol })
                });
                const data = await res.json();

                if (data.success) {
                    alert(`✅ Venda de ${symbol} solicitada com sucesso!`);
                    fetchPositions(); // Atualiza lista
                } else {
                    alert(`❌ Erro ao vender: ${data.error}`);
                }
            } catch (e) {
                alert(`Erro de conexão: ${e.message}`);
            }
        }

    </script>
</body>

</html>
